version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./../database/schema/postgresql/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./../database/schema/002_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./../database/schema/003_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
      - ./../database/schema/postgresql/004_reset_sequences.sql:/docker-entrypoint-initdb.d/04_reset.sql
  java-app:
    build:
      context: ../java-app
      dockerfile: ../docker/java.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart_inventory
      DB_USER: postgres
      DB_PASSWORD: postgres
      PYTHON_ANALYTICS_URL: http://python-analytics:8000
      PYTHON_ANALYTICS_API_KEY: dev-analytics-key
      JWT_SECRET: change-me-in-production
    ports:
      - "8080:8080"
    depends_on:
      - db
      - python-analytics
  python-analytics:
    build:
      context: ../python-analytics
      dockerfile: ../docker/python.Dockerfile
    environment:
      ANALYTICS_API_KEY: dev-analytics-key
    ports:
      - "8000:8000"
volumes:
  pgdata:
